services:
  mongodb:
    image: mongo:7.0
    container_name: cfobuddy-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cfobuddy-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=cfobuddy
      - LLM_MODEL_NAME=
      - GROQ_API_KEY=
      - DATABASE_URL=
      - TWELVE_DATA_API_KEY=
      - CFO_BUDDY_JWT_SECRET=
      - CFO_BUDDY_AUTH_USERNAME=
      - CFO_BUDDY_AUTH_PASSWORD=
    volumes:
      - ./data:/app/data
      - ./static/charts:/app/static/charts
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cfobuddy-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
